name: CI

on:
  push:
    branches:
      - main
      - review
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: true

      - name: Install dependencies
        run: pdm install --check -d -G orm -G docs -G crypto

      - name: Run tests
        run: pdm run pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: '3.12'
          cache: true

      - name: Build sdist and wheel
        run: pdm build

      # A core `pip install ushka` must not need any extra to import the
      # package or to run the CLI.
      - name: Smoke test the wheel with core dependencies only
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          /tmp/core/bin/python -c "import ushka; print(ushka.__all__)"
          /tmp/core/bin/ushka --help

      # The release workflow builds the SBOM the same way; running it on every
      # build means a release never is the first time this step runs.
      - name: Generate the SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install --quiet cyclonedx-bom==8.0.1
          /tmp/sbom-tool/bin/cyclonedx-py environment /tmp/core --pyproject pyproject.toml --of JSON -o dist/ushka.cdx.json
          python -c "import json; d = json.load(open('dist/ushka.cdx.json')); print(d['bomFormat'], d['specVersion'], len(d['components']), 'components')"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: '3.12'
          cache: true

      - name: Install dependencies
        run: pdm install --check -d -G orm -G docs -G crypto

      # Ushka Docs renders every page and fails on broken links, anchors or
      # nav entries (the API reference is generated from the docstrings).
      - name: Check every page, link and anchor
        run: pdm run ushka docs check docs --api ushka
