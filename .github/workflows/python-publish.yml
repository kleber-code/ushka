name: PYPI

# Runs only for a published release. Creating a release also pushes its tag, so
# a `push: tags` trigger ran the job twice and the second upload failed with
# "File already exists".
#
# What a release carries, and how to check it (see .github/SECURITY.md):
#   - the sdist and wheel, built once, in a job that cannot publish;
#   - a CycloneDX SBOM (ushka.cdx.json) of the runtime dependencies;
#   - GitHub build-provenance and SBOM attestations (`gh attestation verify`);
#   - PyPI trusted publishing with PEP 740 attestations (no long-lived token).
#
# Every action is pinned to a full commit SHA: a tag can be moved, a SHA cannot.
# Dependabot proposes the updates (.github/dependabot.yml).
on:
  release:
    types: [published]

permissions: {}

jobs:
  release-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up PDM
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37 # v4
        with:
          python-version: "3.12"
          cache: false

      - name: Build release distributions
        run: pdm build

      # The tag is typed by a person; the package version is what PyPI would
      # publish. A mismatch means the wrong commit is being released.
      # (The tag goes through `env`, never straight into the script.)
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import glob, re; print(re.search(r'ushka-(.+?)(?:-py3|\.tar)', glob.glob('dist/*.whl')[0].split('/')[-1]).group(1))")
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match the built version '$version'." >&2
            exit 1
          fi

      - name: Smoke test the wheel with core dependencies only
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          /tmp/core/bin/python -c "import ushka; print(ushka.__all__)"
          /tmp/core/bin/ushka --help

      # The SBOM lists what `pip install ushka` brings in. The tool runs from
      # its own venv so it is not part of the list, and its version is pinned.
      - name: Generate the SBOM (CycloneDX)
        run: |
          python -m venv /tmp/sbom-tool
          /tmp/sbom-tool/bin/pip install --quiet cyclonedx-bom==8.0.1
          /tmp/sbom-tool/bin/cyclonedx-py environment /tmp/core --pyproject pyproject.toml --of JSON -o sbom/ushka.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dists
          path: dist/

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom/

  # Signs what was built. Separate from publishing so each job holds only the
  # permissions it needs.
  attest:
    runs-on: ubuntu-latest
    needs: release-build
    permissions:
      contents: write # attach the SBOM to the release
      id-token: write # sign with the workflow's OIDC identity
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-sbom
          path: sbom/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: sbom/ushka.cdx.json

      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" sbom/ushka.cdx.json --repo "$REPO" --clobber

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
      - attest
    permissions:
      # Mandatory for trusted publishing: PyPI trusts this workflow, no token is stored.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/ushka/${{ github.event.release.name || github.ref_name }}
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          attestations: true
