    "ushka.guard.untrusted",
    "ushka.guard.safe",
    "ushka.guard.sinks",
    "ushka.guard.templates",
    "ushka.guard.rewrite",
    "ushka.guard.errors",
]

[[api.group]]
title = "Guard integrations"
description = "Ushka Guard for Starlette, FastAPI and Django."
modules = [
    "ushka.guard.integrations.starlette",
    "ushka.guard.integrations.fastapi",
    "ushka.guard.integrations.django",
]

[[api.group]]
title = "Data, templates and files"
description = "The ORM, the Jinja engine, static files and flash messages."
modules = [
    "ushka.orm.database",
    "ushka.templating.engine",
    "ushka.static.files",
    "ushka.templating.flash",
