[api]
title = "API reference"
description = "Generated from the docstrings. Every module has an index of its classes and functions at the top."

[[api.group]]
title = "Core"
description = "The application object, routing, configuration and error handling."
modules = [
    "ushka.core.app",
    "ushka.core.router",
    "ushka.core.config",
    "ushka.core.error_handler",
    "ushka.core.settings",
    "ushka.core.server",
    "ushka.core.log",
]

[[api.group]]
title = "HTTP"
description = "Requests, responses, typed parameters, validation, sessions, streaming and WebSockets."
modules = [
    "ushka.http.request",
    "ushka.http.response",
    "ushka.http.params",
    "ushka.http.validation",
    "ushka.http.cookies",
    "ushka.http.redirect",
    "ushka.http.stream",
    "ushka.http.websocket",
    "ushka.http.multipart",
    "ushka.http.error",
    "ushka.http.exceptions",
]

[[api.group]]
title = "Sessions"
description = "The signed-cookie session and revocable server-side sessions."
modules = ["ushka.sessions.session", "ushka.sessions.stores", "ushka.sessions.forge"]

[[api.group]]
title = "Security"
description = "The security middleware that is on by default: CSRF, headers, CORS and trusted hosts."
