site_name: Ushka Framework
site_url: https://kleber-code.github.io/ushka
repo_url: https://github.com/kleber-code/ushka
repo_name: kleber-code/ushka
edit_uri: ""

nav:
    - "Home": index.md
    - "Features": features.md
    - "Guide":
          - "Introduction": "guide/index.md"
          - "Configuration": "guide/configuration.md"
          - "Routing": "guide/routing.md"
          - "Templates": "guide/templates.md"
          - "Static Files": "guide/static_files.md"
          - "ORM": "guide/orm.md"
          - "CLI": "guide/cli.md"
          - "Dependency Injection": "guide/dependency_injection.md"
          - "Flashing": "guide/flashing.md"
          - "Error Handling": "guide/error_handling.md"
    - "Tutorials":
          - "Getting Started": "tutorials/index.md"
    - "Roadmap": roadmap.md
    - "API Reference":
          - "Core":
              - "Application": "api/core/app.md" # This should be the new path for the new structure, but it was deleted in my commit. I'll re-add it.
              - "Configuration": "api/core/config.md"
              - "Exceptions": "api/core/exceptions.md"
              - "Logging": "api/core/log.md"
              - "Router": "api/core/router.md" # Router is now in core
          - "HTTP":
              - "Exceptions": "api/http/exceptions.md"
              - "Request": "api/http/request.md"
              - "Response": "api/http/response.md"
              - "Cookies": "api/http/cookies.md" # Added during refactor
              - "Multipart": "api/http/multipart.md" # Added during refactor
              - "Redirect": "api/http/redirect.md" # Added during refactor
              - "Sessions": "api/http/sessions.md" # Added during refactor
              - "Error": "api/http/error.md" # Added during refactor
          - "ORM":
              - "Database": "api/orm/database.md" # New package
          - "Static":
              - "Files": "api/static/files.md" # New package
          - "Templating":
              - "Engine": "api/templating/engine.md" # New package
          - "Utils":
              - "Flash": "api/utils/flash.md" # New package

theme:
    name: material
    logo: assets/logo.jpg
    favicon: assets/favicon/favicon.ico

    palette: 
      - scheme: default
        toggle:
          icon: material/brightness-7 
          name: Switch to dark mode

      - scheme: slate
        toggle:
          icon: material/brightness-4
          name: Switch to light mode
    
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.tabs.link
        - content.code.annotation
        - content.code.copy
        - search.suggest
    icon:
        repo: fontawesome/brands/github

extra:
    version:
        provider: mike
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/kleber-code
        - icon: fontawesome/brands/python
          link: https://pypi.org/project/ushka/
    manifest: "assets/favicon/site.webmanifest"
    extra_css:
        - assets/custom.css

markdown_extensions:
    - admonition
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - toc:
          permalink: true
plugins:
    - mkdocstrings:
        handlers:
            python:
                load_external_modules: true
                paths: [src]
    - termynal
    - optimize