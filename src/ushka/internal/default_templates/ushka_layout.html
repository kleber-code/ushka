<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>{% block title %}Ushka Framework{% endblock %}</title>
    <style>
      :root {
        --bg: #eef9f3; --dot: #cdebdc; --card: #ffffff; --line: #dcebe3;
        --text: #1b1720; --sub: #554d5e;
        --pink: #ffe2d0; --lav: #e7e1f0; --mint: #d3f5e6; --peach: #ffe3cf; --sky: #d6ecff;
        --accent: #b84e17; --on-pill: #3a1a08;
        --code-bg: #f4f8f6; --hl-bg: #ffe4d4; --hl-bar: #f07a3a;
        --err: #a3173f; --err-bg: #ffe6ee;
        --shadow: 0 6px 20px rgba(184, 78, 23, .08), 0 1px 3px rgba(27, 23, 32, .06);
        --radius: 1.25rem;
        --font: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
        --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15121a; --dot: #24302a; --card: #1f1a26; --line: #332c3c;
          --text: #f4f1f6; --sub: #c9c2cf;
          --pink: #5a3420; --lav: #352e40; --mint: #24493f; --peach: #573b2c; --sky: #263f5c;
          --accent: #ff9a5c; --on-pill: #fff0e6;
          --code-bg: #1b1720; --hl-bg: #4a2a18; --hl-bar: #ff9a5c;
          --err: #ffb3c8; --err-bg: #3f1b2b;
          --shadow: 0 6px 20px rgba(0, 0, 0, .35);
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0; min-height: 100vh; display: flex; flex-direction: column;
        font: 500 1rem/1.6 var(--font); color: var(--text); background-color: var(--bg);
        background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
        background-size: 22px 22px;
      }
      a { color: var(--accent); text-underline-offset: .2em; }
      a:focus-visible, summary:focus-visible { outline: 3px solid var(--hl-bar); outline-offset: 2px; border-radius: .5rem; }
      h1, h2, h3 { line-height: 1.2; margin: 0; }
      code, pre, kbd { font-family: var(--mono); font-size: .9em; }
      :not(pre) > code { background: var(--lav); padding: .1em .4em; border-radius: .4em; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

      /* Layout */
      .page-center { justify-content: center; align-items: center; padding: 1.5rem 1rem; }
      .wrap { width: 100%; max-width: 46rem; margin: 0 auto; }
      .wrap-wide { max-width: 72rem; padding: 1.25rem 1rem 3rem; }
      .center { text-align: center; }
      .stack > * + * { margin-top: 1.25rem; }

      /* The Ushka emblem */
      .mascot { display: inline-block; width: clamp(3.5rem, 12vw, 5rem); animation: bob 2.6s ease-in-out infinite; }
      .mascot img { display: block; width: 100%; height: auto; }
      .mascot-sm { width: 2.6rem; }
      .blush { color: var(--accent); }
      @keyframes bob { 50% { transform: translateY(-5px) rotate(-2deg); } }
      @media (prefers-reduced-motion: reduce) { .mascot { animation: none; } }

      /* Components */
      .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
      .card-body { padding: 1.25rem 1.5rem; }
      .card-head { padding: 1rem 1.5rem; background: var(--code-bg); border-bottom: 1px solid var(--line); }
      .card-foot { padding: .9rem 1.5rem; border-top: 1px solid var(--line); background: var(--code-bg); }
      .muted { color: var(--sub); }
      .small { font-size: .85rem; }
      .title-xl { font-size: clamp(2.2rem, 9vw, 4rem); font-weight: 800; letter-spacing: -.02em; }
      .lead { font-size: clamp(1.05rem, 3.5vw, 1.35rem); color: var(--sub); margin: .5rem 0 0; }
      .pill {
        display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1.4rem; border-radius: 99px;
        background: var(--pink); color: var(--on-pill); font-weight: 700; text-decoration: none;
        border: 1px solid var(--line); box-shadow: var(--shadow); transition: transform .15s ease;
      }
      .pill:hover { transform: translateY(-2px); }
      .tag {
        display: inline-block; padding: .1rem .6rem; border-radius: 99px; font: 700 .75rem/1.6 var(--mono);
        background: var(--lav); color: var(--text); letter-spacing: .03em;
      }
      .icon { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .grid-2 { display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
      @media (min-width: 720px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
      .links { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
      .links a {
        display: flex; align-items: center; gap: .8rem; padding: .7rem .9rem; border-radius: 1rem;
        color: var(--text); font-weight: 700; text-decoration: none; border: 1px solid var(--line); background: var(--card);
      }
      .links a:hover { background: var(--code-bg); }
      .bubble { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 50%; color: var(--on-pill); }
      .b-pink { background: var(--pink); } .b-mint { background: var(--mint); } .b-sky { background: var(--sky); } .b-peach { background: var(--peach); }
      .route-list { list-style: none; margin: 0; padding: 0; max-height: 18rem; overflow-y: auto; }
      .route-list li { display: flex; gap: .75rem; align-items: baseline; padding: .55rem .25rem; border-bottom: 1px dashed var(--line); font-family: var(--mono); font-size: .9rem; overflow-wrap: anywhere; }
      .route-list li:last-child { border-bottom: 0; }

      /* Code blocks: line numbers + highlighted line, no JS */
      pre.code {
        margin: 0; padding: .75rem 0; overflow-x: auto; background: var(--code-bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 1rem; font-size: .85rem; line-height: 1.65; tab-size: 4;
      }
      pre.code .line { display: block; padding: 0 1rem 0 0; border-left: 4px solid transparent; min-width: max-content; }
      pre.code .ln {
        display: inline-block; min-width: 3.5em; padding: 0 1em 0 .5em; margin-right: .75em; text-align: right;
        color: var(--sub); border-right: 1px solid var(--line); user-select: none; -webkit-user-select: none;
      }
      pre.code .hl { background: var(--hl-bg); border-left-color: var(--hl-bar); font-weight: 700; }
      pre.code .hl .ln { color: var(--text); }
      pre.raw { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; }

      /* Debug page */
      .debug-head { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; }
      .err-box {
        background: var(--err-bg); color: var(--err); border: 1px solid var(--line); border-left: 6px solid var(--hl-bar);
        border-radius: var(--radius); padding: 1rem 1.25rem; font: 600 1rem/1.5 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; margin: 0;
      }
      details.frame { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
      details.frame + details.frame { margin-top: .9rem; }
      details.frame > summary { cursor: pointer; padding: .9rem 1.2rem; list-style-position: outside; display: flex; flex-wrap: wrap; gap: .25rem .75rem; align-items: baseline; }
      details.frame > summary::-webkit-details-marker { display: none; }
      details.frame > summary::before { content: "\25B8"; color: var(--accent); transition: transform .15s ease; }
      details.frame[open] > summary::before { transform: rotate(90deg); }
      details.frame[open] > summary { border-bottom: 1px solid var(--line); }
      .fn { font: 700 .95rem var(--mono); }
      .path { font: .8rem var(--mono); color: var(--sub); overflow-wrap: anywhere; flex-basis: 100%; }
      .frame-body { padding: 1rem 1.2rem 1.2rem; }
      .frame-body > * + * { margin-top: 1rem; }
      details.sub > summary { cursor: pointer; font-weight: 700; padding: .3rem 0; }
      table.vars { width: 100%; border-collapse: collapse; font: .8rem/1.5 var(--mono); margin-top: .5rem; }
      table.vars th, table.vars td { text-align: left; vertical-align: top; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
      table.vars th { width: 28%; font-weight: 700; word-break: break-all; }
      table.vars td { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--sub); }
      .section-title { margin-bottom: .75rem; }
      .badge-now { background: var(--pink); color: var(--on-pill); }
      footer.site { margin-top: auto; padding: 1.25rem 1rem; text-align: center; font-size: .8rem; color: var(--sub); }
    </style>
    {% block head_extra %}{% endblock %}
  </head>
  <body id="top" class="{% block body_classes %}{% endblock %}">
    {% block main_content %}{% endblock %}
    {% block scripts_extra %}{% endblock %}
  </body>
</html>
