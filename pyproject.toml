[project]
name = "ushka"
version = "0.8.0b5"
description = "The async Python web framework where insecure code, yours or your AI's, does not run silently: untrusted data is a type, dangerous sinks refuse it."
authors = [
    { name = "kleber-code", email = "kleber.code@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["web", "framework", "asgi", "async", "security", "taint", "xss", "llm", "prompt-injection", "t-strings", "routing", "orm"]

# Classifiers atualizados para refletir suporte a Banco de Dados
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database :: Front-Ends",
    "Topic :: Security",
]

# --- 1. CORE ---
# pip install ushka
# Kept deliberately small. Everything else (config, .env, terminal colours,
# CLI, Ushka Guard) is implemented with the standard library.
# - uvicorn: the ASGI server behind `ushka dev` / `ushka run` / `app.run()`.
# - jinja2: templates; the built-in error pages use it on every import.
# - python-multipart: a hardened multipart parser. Parsing untrusted uploads
#   is security-critical, so it is not reimplemented here.
# - uvloop and httptools: the fast event loop and HTTP parser, in C. Uvicorn
#   picks them up by itself when installed, which is about 2.3x the requests
#   per second of the pure-Python loop and parser (see benchmarks/README.md).
#   uvloop has no Windows or PyPy build, so those fall back to asyncio and h11.
# - tomli: TOML reader, only on Python 3.10 (3.11+ ships `tomllib`).
dependencies = [
    "uvicorn>=0.38.0",
    "uvloop>=0.21.0; sys_platform != 'win32' and platform_python_implementation == 'CPython'",
    "httptools>=0.6.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://ushka.satela.com.br"
Documentation = "https://ushka.satela.com.br/docs/"
Changelog = "https://github.com/kleber-code/ushka/blob/main/CHANGELOG.md"
Issues = "https://github.com/kleber-code/ushka/issues"
Repository = "https://github.com/kleber-code/ushka"

[project.scripts]
ushka = "ushka.cli:main"

# --- 2. PACOTES OPCIONAIS (EXTRAS) ---
[project.optional-dependencies]

# pip install ushka[web]
# Kept for backwards compatibility: both packages are part of the core install.
web = [
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
]

# pip install ushka[orm]
# Inclui o driver aiosqlite por padrão para a melhor experiência "out-of-the-box"
orm = [
    # `[asyncio]` pulls in greenlet, which SQLAlchemy 2.1 no longer installs by
    # default; without it `sqlalchemy.ext.asyncio` fails to import.
    "sqlalchemy[asyncio]>=2.0.44",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
]

# pip install ushka[docs] -> Ushka Docs (ushka.docs): Markdown docs site with
# server-side highlighting, search and an API reference from docstrings.
docs = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
    "griffe>=1.5",
]

# pip install ushka[crypto] -> Ushka Crypto (ushka.crypto): Fernet encryption,
# encrypted session cookies and the `db.Encrypted` column. The cipher is the
# audited `cryptography` package; Ushka never implements its own.
crypto = [
    "cryptography>=43",
]

# pip install ushka[postgres]
postgres = [
    "ushka[orm]",
    "asyncpg>=0.29.0",
]

# pip install ushka[mysql]
mysql = [
    "ushka[orm]",
    "aiomysql>=0.2.0",
]

# pip install ushka[standard] -> O KIT RECOMENDADO
standard = [
    "ushka[web]",
    "ushka[orm]",
]

# pip install ushka[full] -> O KIT COMPLETO
full = [
    "ushka[standard]",
    "ushka[docs]",
    "ushka[crypto]",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src/ushka"]
excludes = ["src/ushka/internal/assets", "example"]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pyyaml>=6.0.3",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Only for the tests of ushka.guard.integrations (skipped when missing).
    "starlette>=0.40",
    "fastapi>=0.115",
    "django>=5.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
